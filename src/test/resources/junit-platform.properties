#Регистрация в junit-platform.properties нового listener:
# Отключение стандартных listeners (опционально)
junit.platform.execution.listeners.deactivate=org.junit.platform.launcher.listeners.LoggingListener
# Включение нашего listener
junit.platform.execution.listeners.include=tv.codealong.tutorials.various.other.ThreadMonitoringListener

# Для глобальной предзагрузки -  Включение нашего listener
#junit.platform.execution.listeners.include=com.example.GlobalPreloadListener

# Для отключения стандартных listeners (опционально)
#junit.platform.execution.listeners.deactivate=org.junit.platform.launcher.listeners.LoggingListener


# Настройки параллельного выполнения
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
#Обязательный параметр конфигурации в качестве желаемого параметра параллелизма - тестовый движок пытается запустить до 4 тестов одновременно.
junit.jupiter.execution.parallel.config.fixed.parallelism=4

#Необязательный параметр конфигурации может использоваться для ограничения максимального количества потоков.
junit.jupiter.execution.parallel.config.fixed.max-pool-size=8

