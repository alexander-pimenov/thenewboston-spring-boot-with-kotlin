server:
  port: 9100

another:
  host: ${ANOTHER_HOST:http://localhost}
  port: ${ANOTHER_PORT:9090}
  timeout: ${ANOTHER_TIMEOUT:60000}

spring:
  application:
    name:
      the-new-boston-demo
  kafka:
    producer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      client-id: "demo-newboston-producer"
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 2147483647
      enable-idempotence: true
      max-in-flight-requests-per-connection: 1
      ssl-provider: none
      properties:
        spring.json.add.type.headers: false
    topics:
      email: "email-events"
      notification: "notification-events"
      user: "user-events"
#  настройка ObjectMapper (так же смотри в конфигурационных бинах)
  jackson:
    serialization:
      write-dates-as-timestamps: false
      inclusion: non_null
    modules:
      - java-time

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

check:
  beans:
    enabled: true

main:
  balancing:
    group: DUPLICATE

audit:
  enabled: true
  client:
    mode: sync
    rest:
      enabled: true
      url: http://localhost:8080
      timeout: 60000
    kafka:
      enabled: true
      topic: audit-topic
      servers: localhost:9092

logging:
  level:
    tv.codealong.tutorials: DEBUG
    org.springframework.security: DEBUG

app:
  jwt:
    secret: my-super-secret-key-that-is-at-least-32-characters-long
    expiration-ms: 86400000 # 24 hours
    issuer: demo-app
    allowed-audiences: web,mobile

